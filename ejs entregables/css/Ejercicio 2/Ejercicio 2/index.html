<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Instagram</title>
    <link rel="stylesheet" type="text/css" href="style/style.css" />
  </head>
  <body>
    <header>
      <section id="logos">
        <img id="imagenLogo" src="img/logo.png" alt="logoInstagram" />
        <h1 id="textoLogo">Instagram</h1>
      </section>
      <section id="contenedorBuscador">
        <input type="text" placeholder="Busca" id="buscador" />
      </section>
    </header>
    <main>
      <section id="foto">
        <img id="fotoPrincipal" src="img/foto.png" alt="fotoPrincipal" />
      </section>
      <section id="comentarios">
        <section id="perfil">
          <article id="imagenPerfil">
            <img
              class="fotoPerfil"
              src="img/fotoPerfil.png"
              alt="fotoDePerfil"
            />
          </article>
          <article id="nombreUsuario"><p>rosalia.vt · Seguir</p></article>
          <article id="localizacion"><p>Los Angeles, California</p></article>
          <article id="masOpciones"><p>...</p></article>
        </section>
        <section id="informacionFoto">
          <img
            class="fotoPerfil"
            src="img/fotoPerfil.png"
            alt="fotoDePerfil"
            id="fotoPerfilPublicacion"
          />
          <p id="descripcionPublicacion">
            rosalia.vt Performing en LA this weekend CALIBASHHHHHHH hiihi
          </p>
          <p id="fechaPublicacion">4 sem</p>
        </section>

        <section id="simboloMas"><p>+</p></section>
        <section id="comentario">
          <article id="fotoPerfilComentario">
            <img
              class="fotoPerfil2"
              src="img/fotoPerfil2.png"
              alt="fotoDePerfil"
            />
          </article>
          <p id="descripcionComentario">jenny.lmk</p>
          <p id="fechaComentario">1 sem Responder</p>
        </section>
        <section id="interacciones">
          <section id="interaccionLogos">
            <p></p>
            <p></p>
            <p></p>
            <p></p>
          </section>
          <section id="informacionInteraccion">
            <p>1.432.352 Me gusta</p>
            <p>10 DE ENERO</p>
            <p>Iniciar sesion para indicar que te gusta o comentar.</p>
          </section>
        </section>
      </section>
    </main>
  </body>
</html>
